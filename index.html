<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toptable</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script>
      try {
        if (localStorage.getItem('tt-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (error) {
        /* Storage can be blocked. Light theme remains. */
      }
    </script>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="dice"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
